name: main

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

# Least-privilege default: a read-only token for every job. Jobs that need
# more (e.g. commenting on PRs) elevate their own permissions below.
permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            src: ${{ steps.filter.outputs.src }}
            testbed: ${{ steps.filter.outputs.testbed }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
              id: filter
              with:
                  filters: |
                      src:
                        - 'crates/**'
                        - 'packages/rapier-2d/**'
                        - 'packages/rapier-3d/**'
                        - 'Cargo.toml'
                        - 'Cargo.lock'
                        - 'pnpm-lock.yaml'
                      testbed:
                        - 'packages/testbed2d/**'
                        - 'packages/testbed3d/**'

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: "24"
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - name: Check formatting
              run: pnpm fmt --check
            - name: Lint
              run: pnpm lint
            - name: Check Rust formatting
              run: cargo fmt -- --check

    build:
        runs-on: ubuntu-latest
        needs: [changes]
        if: needs.changes.outputs.src == 'true' || needs.changes.outputs.testbed == 'true'
        env:
            RUSTFLAGS: -D warnings
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: "24"
                  cache: "pnpm"
            - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
            - run: pnpm install --frozen-lockfile
            - name: Build WASM and TypeScript
              run: pnpm build
            - name: Typecheck
              run: pnpm typecheck
            - name: Install wabt
              run: sudo apt-get install -y wabt
            - name: Check 2D SIMD build contains SIMD instructions
              run: |
                  if ! wasm-objdump -d packages/rapier-2d/wasm/release-simd/rapier_wasm_2d_bg.wasm | grep ':\sfd' ; then
                    echo "ERROR: 2D SIMD build does not include SIMD opcode prefix." >&2
                    exit 1
                  fi
            - name: Check 3D SIMD build contains SIMD instructions
              run: |
                  if ! wasm-objdump -d packages/rapier-3d/wasm/release-simd/rapier_wasm_3d_bg.wasm | grep ':\sfd' ; then
                    echo "ERROR: 3D SIMD build does not include SIMD opcode prefix." >&2
                    exit 1
                  fi
            - name: Upload build artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: build-artifacts
                  path: |
                      packages/rapier-2d/dist
                      packages/rapier-2d/wasm
                      packages/rapier-3d/dist
                      packages/rapier-3d/wasm
                  retention-days: 1

    benchmark:
        runs-on: ubuntu-latest
        needs: [changes, build]
        if: github.event_name == 'pull_request' && needs.changes.outputs.src == 'true'
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: "24"
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - name: Download build artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: build-artifacts
                  path: packages
            - name: Run benchmarks
              id: bench
              run: |
                  pnpm bench:quick --no-compare 2>&1 | tee bench-output.txt

                  # Find the latest results file
                  RESULTS_FILE=$(ls -t packages/benchmarks/results/3d-*.json | head -1)
                  echo "results_file=$RESULTS_FILE" >> $GITHUB_OUTPUT

                  # Generate markdown table from results
                  node -e "
                  const fs = require('fs');
                  const data = JSON.parse(fs.readFileSync('$RESULTS_FILE', 'utf-8'));

                  function formatTime(ms) {
                    if (ms < 0.001) return (ms * 1000000).toFixed(0) + 'ns';
                    if (ms < 1) return (ms * 1000).toFixed(1) + 'µs';
                    return ms.toFixed(3) + 'ms';
                  }

                  let md = '## ⚡ Benchmark Results\n\n';
                  md += '| Benchmark | Mean | Min | Max |\n';
                  md += '|-----------|------|-----|-----|\n';

                  for (const r of data.results) {
                    md += '| ' + r.name + ' | ' + formatTime(r.mean) + ' | ' + formatTime(r.min) + ' | ' + formatTime(r.max) + ' |\n';
                  }

                  md += '\n<details>\n<summary>Environment</summary>\n\n';
                  md += '- **Node:** ' + data.node + '\n';
                  md += '- **Platform:** ' + data.platform + '/' + data.arch + '\n';
                  md += '- **Runner:** ubuntu-latest\n';
                  md += '- **Timestamp:** ' + data.timestamp + '\n';
                  md += '</details>\n';

                  fs.writeFileSync('benchmark-comment.md', md);
                  "
            - name: Post or update PR comment
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const fs = require('fs');
                      const body = fs.readFileSync('benchmark-comment.md', 'utf-8');
                      const marker = '<!-- rapier-benchmark-comment -->';
                      const fullBody = marker + '\n' + body;

                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });

                      const existing = comments.find(c => c.body.includes(marker));

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body: fullBody,
                        });
                        console.log('Updated existing benchmark comment');
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: fullBody,
                        });
                        console.log('Created new benchmark comment');
                      }

    deploy-testbed:
        runs-on: ubuntu-latest
        needs: [changes, build]
        if: |
            (
              (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
              github.event_name == 'pull_request'
            ) &&
            (needs.changes.outputs.src == 'true' || needs.changes.outputs.testbed == 'true')
        permissions:
            contents: read
            pull-requests: write
        strategy:
            matrix:
                include:
                    - name: testbed3d
                      package: rapier-testbed3d
                      project-id: VERCEL_PROJECT_ID_TESTBED3D
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: "24"
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - name: Download build artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: build-artifacts
                  path: packages
            - name: Build testbed
              run: pnpm --filter ${{ matrix.package }} build
            # On master pushes deploy to production (--prod); on pull requests
            # deploy a preview build instead.
            - name: Deploy to Vercel
              id: deploy
              uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42.3.0
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
                  vercel-project-id: ${{ secrets[matrix.project-id] }}
                  vercel-args: ${{ github.event_name == 'push' && '--prod' || '' }}
                  working-directory: packages/${{ matrix.name }}
                  github-comment: false
            - name: Comment preview URL on PR
              if: github.event_name == 'pull_request'
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
                  TESTBED: ${{ matrix.name }}
              with:
                  script: |
                      const url = process.env.PREVIEW_URL;
                      const testbed = process.env.TESTBED;
                      const marker = `<!-- rapier-testbed-preview-${testbed} -->`;
                      const sha = context.sha.slice(0, 7);
                      const body = url
                        ? `${marker}\n## 🚀 \`${testbed}\` preview\n\nPreview deployment: ${url}\n\n_Updated for commit ${sha}._`
                        : `${marker}\n## 🚀 \`${testbed}\` preview\n\nDeployment did not return a preview URL for commit ${sha}.`;

                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });

                      const existing = comments.find(c => c.body.includes(marker));

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body,
                        });
                        console.log('Updated existing preview comment');
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                        });
                        console.log('Created new preview comment');
                      }
