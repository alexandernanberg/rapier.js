[package]
name = "rapier-wasm-2d"
version = "0.19.3"
edition = "2021"
license = "Apache-2.0"
description = "2-dimensional physics engine - official WASM bindings"

[lib]
crate-type = ["cdylib"]
path = "../../src/lib.rs"

[features]
default = ["dim2"]
dim2 = []
# SIMD is always enabled in rapier >= 0.35 (backed by `wide`, which falls back to
# scalar code where unsupported). The SIMD build variant is now produced purely by
# building with `-C target-feature=+simd128`.
deterministic = ["rapier2d/enhanced-determinism"]

[dependencies]
rapier2d = { version = "0.35", features = ["debug-render", "serde-serialize", "unsync-callbacks"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
bitflags = "2"
palette = "0.7"
bincode = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("dim2", "dim3"))',
] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--all-features"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
